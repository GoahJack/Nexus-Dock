        navigator.mediaSession.playbackState = player.paused ? 'paused' : 'playing'
      }

      async function tryPlay() {
        try {
          await player.play()
          syncState()
          label.textContent = '正在播放：Nexus 主题曲 · 玻璃海岸（SMTC 应可见）'
        } catch (error) {
          label.textContent = '自动播放被拦截，请点击下方「开始播放」；元数据已就绪。'
        }
      }

      start.addEventListener('click', () => {
        void tryPlay()
      })
      player.addEventListener('play', syncState)
      player.addEventListener('pause', syncState)
      window.addEventListener('load', () => {
        void tryPlay()
        // 某些策略下首次播放被拦，用户随便点一下页面后补播
        window.addEventListener('pointerdown', () => void tryPlay(), { once: true })
      })
    </script>
  </body>
</html>
